name: CI

# Branch protection on `main` requires the `check` job below, so this file is what makes
# "require a pull request" mean something rather than being pure ceremony.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macos-latest, not ubuntu. Hangar is a macOS app, and the E2E suite launches a real Electron
    # binary — on Linux that needs a virtual display and would be testing a platform nobody runs.
    # Free for public repos, so the 10x macOS minute multiplier doesn't apply.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to point at anything, and this
      # job runs with the repo checked out. Dependabot keeps the pins current (dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # From .nvmrc, so CI and `nvm use` can't name different versions. 24 is the active LTS;
          # `engines` in package.json is the floor below which the toolchain stops working.
          node-version-file: .nvmrc
          cache: npm

      # ~180 MB, and it does not change between runs of the same Electron version. Restored
      # *before* `npm ci`, because our postinstall is what downloads it — see below.
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Electron 43 has no postinstall of its own — it ships an explicit `install-electron` bin
      # instead, so without ours a clean `npm ci` left node_modules/electron with no binary and no
      # path.txt, and Playwright's `_electron.launch` failed before anything downloaded it. Our
      # package.json now runs `install-electron` as its postinstall, idempotently.
      - run: npm ci

      # The main process's dependencies, not the toolchain: a high-severity advisory in one of those
      # runs beside every service's session. Not everything that ships, though — React, react-dom
      # and dnd-kit are devDependencies, bundled into the renderer by Vite, so `--omit=dev` skips
      # them. They're left to Dependabot with the build tools; auditing all of devDependencies fails
      # on advisories in vitest, electron-builder and postcss that never reach the app.
      - run: npm audit --omit=dev --audit-level=high

      # typecheck (app + tests), the vitest unit suite, and the dependency-cruiser boundary rules
      # between core/, main/ and shared/. None of this needs the Electron binary.
      - run: npm run check

      # Builds into out/ first — the Playwright harness launches out/main/index.js directly, so
      # without the build it would fail on a missing file rather than on anything real.
      #
      # These cover what unit tests structurally cannot see: an uncalled function, a timer that
      # never fires, and shutdown. The worst bug this project has shipped lived in exactly that
      # gap and passed every unit test.
      - run: npm run test:e2e

      # The build the e2e step just made. See the script for the budget and why it exists.
      - run: node scripts/check-bundle-size.mjs

      # Everything gated on `app.isPackaged` — icons served from `process.resourcesPath`, the launch
      # agent, the production context menu — is invisible to the unpackaged E2E run above, and the
      # bundle's contents are decided by electron-builder's `files` allowlist, not by the code. So
      # package it for real and check what went in. Unsigned: CI has no identity, and the shape of
      # the bundle doesn't depend on one.
      - name: Package, and check the bundle has what the app loads at runtime
        run: |
          # The app icon is generated, not committed (build/ is gitignored), and electron-builder
          # swaps in Electron's own icon without failing when it's missing.
          npm run icon
          npx electron-builder --mac dir --arm64 -c.mac.identity=null
          resources=dist/mac-arm64/Hangar.app/Contents/Resources
          test -f "$resources/icon.icns"
          # Upstream icon licence, and a brand icon, outside the asar where icons.ts looks.
          test -f "$resources/assets/icons/NOTICE"
          test -f "$resources/assets/icons/gmail.svg"
          # The ad blocker loads its preload from inside the archive; missing, it fails at runtime.
          # `--no-install`: our own devDependency, never whatever npx would fetch under that name.
          npx --no-install asar list "$resources/app.asar" | grep -q '@ghostery/adblocker-electron-preload'
          npx --no-install asar list "$resources/app.asar" | grep -q '^/out/main/index.js$'

      # CI traces the retry of a failed test (`on-first-retry`), so this only has content when
      # something broke — the only time anyone wants to download it.
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
